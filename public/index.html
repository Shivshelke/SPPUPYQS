<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Student Count</title>
    <meta name="google-adsense-account" content="ca-pub-6906861946957043">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6906861946957043" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .count-box {
            font-size: 3rem;
            color: #4CAF50;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Live Students on Website</h1>
        <div class="count-box" id="count">0</div>
    </div>

    <!-- Socket.io client script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); // Connect to backend
        
        // Listen for the 'updateCount' event from the server
        socket.on('updateCount', (newCount) => {
            // Update the count in the DOM
            document.getElementById('count').innerText = newCount;
        });
    </script>
</body>
</html>
