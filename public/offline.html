<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>You are Offline — SYNAPSE SPPU PYQ</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
    }
    .offline-icon {
      width: 120px;
      height: 120px;
      margin-bottom: 2rem;
      opacity: 0.8;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, var(--accent), #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

  <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 1l22 22"></path>
    <path d="M16.72 11.06A10.94 10.94 0 0119 12.55"></path>
    <path d="M5 12.55a10.94 10.94 0 015.17-2.39"></path>
    <path d="M10.71 5.05A16 16 0 0122.58 9"></path>
    <path d="M1.42 9a15.91 15.91 0 014.7-2.88"></path>
    <path d="M8.53 16.11a6 6 0 016.95 0"></path>
    <line x1="12" y1="20" x2="12.01" y2="20"></line>
  </svg>

  <h1>You're Offline</h1>
  <p>It seems your internet connection is lost. Don't worry, you can still access papers you've opened before.</p>

  <div class="btn-group">
    <button class="btn-primary" onclick="window.location.reload()">
      <span style="margin-right: 0.5rem">↻</span> Retry Connection
    </button>
    <a href="/my-purchases.html" class="btn-ghost" style="text-decoration:none;">
      Go to My Purchases
    </a>
  </div>

  <script src="/js/theme.js"></script>
</body>
</html>
